<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Sky background -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB342;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#558B2F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B0BEC5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CFD8DC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#546E7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#78909C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="400" fill="url(#sky)" />

  <!-- Sun -->
  <circle cx="530" cy="60" r="40" fill="#FFD54F" opacity="0.85" />
  <circle cx="530" cy="60" r="30" fill="#FFCA28" />

  <!-- Clouds -->
  <ellipse cx="100" cy="70" rx="60" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="140" cy="55" rx="45" ry="22" fill="white" opacity="0.8"/>
  <ellipse cx="60" cy="60" rx="40" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="380" cy="50" rx="55" ry="20" fill="white" opacity="0.75"/>
  <ellipse cx="420" cy="38" rx="40" ry="18" fill="white" opacity="0.75"/>

  <!-- Ground -->
  <rect x="0" y="310" width="600" height="90" fill="url(#ground)" />

  <!-- Road -->
  <rect x="220" y="310" width="160" height="90" fill="#78909C" />
  <rect x="295" y="320" width="10" height="20" fill="#FFF176" />
  <rect x="295" y="355" width="10" height="20" fill="#FFF176" />
  <rect x="295" y="390" width="10" height="20" fill="#FFF176" />

  <!-- Main warehouse building -->
  <rect x="80" y="160" width="440" height="155" fill="url(#wall)" stroke="#90A4AE" stroke-width="2"/>

  <!-- Roof (trapezoid) -->
  <polygon points="60,162 540,162 510,105 90,105" fill="url(#roof)" stroke="#455A64" stroke-width="2"/>
  <!-- Roof ridge line -->
  <line x1="90" y1="105" x2="510" y2="105" stroke="#37474F" stroke-width="3"/>

  <!-- Vertical wall panels -->
  <line x1="160" y1="160" x2="160" y2="315" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="240" y1="160" x2="240" y2="315" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="360" y1="160" x2="360" y2="315" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="440" y1="160" x2="440" y2="315" stroke="#90A4AE" stroke-width="1.5"/>

  <!-- Large main door -->
  <rect x="248" y="225" width="104" height="90" fill="#546E7A" stroke="#37474F" stroke-width="2" rx="2"/>
  <rect x="248" y="225" width="50" height="90" fill="#607D8B" rx="2"/>
  <!-- Door handles -->
  <circle cx="294" cy="272" r="5" fill="#B0BEC5"/>
  <circle cx="306" cy="272" r="5" fill="#B0BEC5"/>

  <!-- Windows left -->
  <rect x="100" y="185" width="50" height="40" fill="#90CAF9" stroke="#546E7A" stroke-width="2" rx="3"/>
  <line x1="125" y1="185" x2="125" y2="225" stroke="#546E7A" stroke-width="1"/>
  <line x1="100" y1="205" x2="150" y2="205" stroke="#546E7A" stroke-width="1"/>

  <rect x="170" y="185" width="50" height="40" fill="#90CAF9" stroke="#546E7A" stroke-width="2" rx="3"/>
  <line x1="195" y1="185" x2="195" y2="225" stroke="#546E7A" stroke-width="1"/>
  <line x1="170" y1="205" x2="220" y2="205" stroke="#546E7A" stroke-width="1"/>

  <!-- Windows right -->
  <rect x="380" y="185" width="50" height="40" fill="#90CAF9" stroke="#546E7A" stroke-width="2" rx="3"/>
  <line x1="405" y1="185" x2="405" y2="225" stroke="#546E7A" stroke-width="1"/>
  <line x1="380" y1="205" x2="430" y2="205" stroke="#546E7A" stroke-width="1"/>

  <rect x="450" y="185" width="50" height="40" fill="#90CAF9" stroke="#546E7A" stroke-width="2" rx="3"/>
  <line x1="475" y1="185" x2="475" y2="225" stroke="#546E7A" stroke-width="1"/>
  <line x1="450" y1="205" x2="500" y2="205" stroke="#546E7A" stroke-width="1"/>

  <!-- Ventilation on roof -->
  <rect x="270" y="90" width="60" height="20" fill="#455A64" rx="3"/>
  <rect x="278" y="82" width="44" height="12" fill="#546E7A" rx="2"/>

  <!-- Fence posts -->
  <rect x="60" y="295" width="8" height="40" fill="#795548"/>
  <rect x="532" y="295" width="8" height="40" fill="#795548"/>
  <rect x="146" y="295" width="6" height="30" fill="#795548"/>
  <rect x="220" y="295" width="6" height="30" fill="#795548"/>
  <rect x="374" y="295" width="6" height="30" fill="#795548"/>
  <rect x="448" y="295" width="6" height="30" fill="#795548"/>
  <!-- Fence wire -->
  <line x1="64" y1="302" x2="149" y2="302" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="64" y1="310" x2="149" y2="310" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="152" y1="302" x2="222" y2="302" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="152" y1="310" x2="222" y2="310" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="376" y1="302" x2="450" y2="302" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="376" y1="310" x2="450" y2="310" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="452" y1="302" x2="536" y2="302" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="452" y1="310" x2="536" y2="310" stroke="#9E9E9E" stroke-width="1.5"/>

  <!-- Label -->
  <rect x="180" y="122" width="240" height="28" fill="#37474F" rx="4" opacity="0.85"/>
  <text x="300" y="141" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">KHO VẬT TƯ - KỸ THUẬT</text>
</svg>
